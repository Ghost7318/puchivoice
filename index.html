<!DOCTYPE html>
<html lang="ja" data-theme="light" data-color="pink">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ぷちボイス Studio ✨</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎙️</text></svg>">
    <style>
        :root {
            --primary: #ff758c;
            --primary-hover: #ff7eb3;
            --bg-gradient: #fff0f3;
            --card-bg: #ffffff;
            --text-color: #4a4a4a;
            --border-color: #ffe0e6;
            --accent-blue: #70a1ff;
            --accent-green: #2ed573;
            --accent-purple: #a55eea;
            --accent-orange: #ff9f43;
            --border-radius: 16px;
            --panel-bg: #ffe6eb;
        }

        [data-theme="dark"] {
            --bg-gradient: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #333333;
            --panel-bg: #2a2a2a;
        }

        [data-color="pink"] { --primary: #ff758c; --primary-hover: #ff7eb3; --light-bg: #fff0f3; --light-panel: #ffe6eb; }
        [data-color="blue"] { --primary: #3498db; --primary-hover: #5dade2; --light-bg: #ebf5fb; --light-panel: #d4e6f1; }
        [data-color="purple"] { --primary: #9b59b6; --primary-hover: #af7ac5; --light-bg: #f4ecf7; --light-panel: #e8daef; }
        [data-color="green"] { --primary: #2ecc71; --primary-hover: #58d68d; --light-bg: #e8f8f5; --light-panel: #d1f2eb; }
        [data-color="yellow"] { --primary: #f1c40f; --primary-hover: #f4d03f; --light-bg: #fef9e7; --light-panel: #fcf3cf; }
        [data-color="red"] { --primary: #e74c3c; --primary-hover: #ec7063; --light-bg: #fdedec; --light-panel: #fadbd8; }

        [data-theme="light"] {
            --bg-gradient: var(--light-bg);
            --panel-bg: var(--light-panel);
        }

        * { box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; max-width: 100%; overflow-x: hidden; margin: 0; padding: 0; }
        body {
            font-family: 'Hiragino Maru Gothic ProN', 'Meiryo UI', 'M PLUS Rounded 1c', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            padding: 8px;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-header {
            text-align: center;
            color: var(--text-color);
            margin-bottom: 10px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .app-header h1 { font-size: 1.5em; margin: 0; letter-spacing: 1px; color: var(--primary); }
        .app-header p { margin: 0; font-size: 0.78em; opacity: 0.85; }

        .theme-selector-bar {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            background: var(--panel-bg);
            padding: 6px 12px;
            border-radius: 18px;
            border: 1px solid var(--border-color);
            margin-bottom: 10px;
            font-size: 0.75em;
        }
        .theme-btn {
            border: none;
            padding: 4px 8px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.72em;
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            min-height: 28px;
        }
        .theme-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .color-dot {
            width: 18px; height: 18px; border-radius: 50%; display: inline-block; cursor: pointer; border: 2px solid white; box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .container {
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 12px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 100%;
            overflow: hidden;
        }

        .card-title {
            font-size: 1.05em;
            color: var(--primary);
            margin-top: 0;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 5px;
        }

        .assist-bar {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 6px 8px;
            margin-bottom: 8px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
        }
        .assist-title { font-size: 0.75em; font-weight: bold; color: var(--primary); }
        .assist-buttons { display: flex; gap: 4px; flex-wrap: wrap; }

        .lib-controls {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 8px;
            background: var(--panel-bg);
            padding: 6px 8px;
            border-radius: 10px;
            align-items: center;
            width: 100%;
            border: 1px solid var(--border-color);
        }

        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
            overflow-x: auto;
            padding-bottom: 3px;
            width: 100%;
            -webkit-overflow-scrolling: touch;
        }
        .tab-btn {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.72em;
            white-space: nowrap;
            color: var(--text-color);
            font-weight: bold;
            flex-shrink: 0;
            min-height: 30px;
        }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .grid-container { max-height: 190px; overflow-y: auto; padding-right: 2px; width: 100%; -webkit-overflow-scrolling: touch; }
        .char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 5px; width: 100%; }
        .char-card {
            background: var(--panel-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            padding: 4px 3px;
            text-align: center;
        }
        .char-card.recorded { border-color: var(--accent-green); background: rgba(46,213,115,0.05); }
        .char-card.selected { border-color: var(--accent-purple); box-shadow: 0 0 6px rgba(165, 94, 234, 0.4); }
        .char-name { font-size: 0.85em; font-weight: bold; color: var(--text-color); margin-bottom: 2px; }

        .btn-mini {
            border: none; border-radius: 6px; padding: 4px 2px; font-size: 0.7em; cursor: pointer; width: 100%; margin-top: 2px; font-weight: bold; min-height: 28px;
        }
        .btn-rec { background: #ff4757; color: white; }
        .btn-rec.recording { animation: pulse 1s infinite; background: #ff6b81; }
        .btn-play { background: var(--accent-blue); color: white; }
        .btn-play:disabled { background: #dfe4ea; cursor: not-allowed; opacity: 0.5; }
        .btn-trim { background: var(--accent-purple); color: white; }
        .btn-trim:disabled { background: #dfe4ea; cursor: not-allowed; opacity: 0.5; }

        .trim-panel {
            background: var(--panel-bg);
            border-radius: 10px;
            padding: 8px;
            margin-top: 6px;
            border: 1px dashed var(--primary);
            width: 100%;
        }
        .trim-title {
            font-size: 0.78em; font-weight: bold; color: var(--primary); margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px;
        }

        .sentence-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 6px;
            overflow-x: auto;
            padding-bottom: 3px;
            width: 100%;
            -webkit-overflow-scrolling: touch;
        }
        .sentence-tab {
            background: var(--panel-bg);
            border: 1.5px solid var(--border-color);
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 0.72em;
            cursor: pointer;
            font-weight: bold;
            color: var(--text-color);
            white-space: nowrap;
            flex-shrink: 0;
            min-height: 28px;
        }
        .sentence-tab.active {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }

        textarea {
            width: 100%;
            height: 60px;
            border: 2px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            border-radius: 10px;
            padding: 8px;
            font-size: 0.9em;
            resize: vertical;
            outline: none;
            font-family: inherit;
        }
        textarea:focus { border-color: var(--primary); }

        .param-group {
            background: var(--panel-bg);
            border-radius: 10px;
            padding: 8px;
            margin: 6px 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            border: 1px solid var(--border-color);
        }
        .param-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.78em;
            width: 100%;
            min-height: 28px;
        }
        .param-row label { width: 105px; font-weight: bold; cursor: pointer; flex-shrink: 0; }
        .param-row label:hover { color: var(--primary); }
        .param-row input[type="range"] { flex: 1; margin: 0 6px; min-width: 0; accent-color: var(--primary); cursor: pointer; height: 24px; }
        .param-val { width: 44px; text-align: right; color: var(--primary); font-weight: bold; flex-shrink: 0; cursor: pointer; }

        .num-input-box {
            width: 54px;
            font-size: 0.75em;
            font-weight: bold;
            text-align: right;
            border: 1.5px solid var(--border-color);
            border-radius: 6px;
            background: var(--card-bg);
            color: var(--primary);
            padding: 2px 4px;
            outline: none;
        }
        .num-input-box:focus { border-color: var(--primary); }

        .action-buttons { display: flex; gap: 6px; margin-top: 6px; width: 100%; }
        .btn-main {
            flex: 1; padding: 10px; border: none; border-radius: 20px; font-size: 0.9em; font-weight: bold; cursor: pointer;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08); display: flex; align-items: center; justify-content: center; gap: 4px; min-height: 44px;
        }
        .btn-talk { background: var(--primary); color: white; }
        .btn-talk:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-save-wav { background: var(--accent-green); color: white; }

        .btn-util {
            background: var(--card-bg); border: 1.5px solid var(--primary); color: var(--primary); padding: 4px 8px; border-radius: 12px; font-size: 0.72em; font-weight: bold; cursor: pointer; min-height: 28px; display: inline-flex; align-items: center; justify-content: center;
        }
        .btn-util:hover { opacity: 0.8; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 12px;
        }
        .modal-box {
            background: var(--card-bg); border-radius: 16px; padding: 16px; text-align: center; max-width: 320px; width: 100%; box-shadow: 0 8px 24px rgba(0,0,0,0.2); border: 1px solid var(--border-color);
        }
        .modal-char { font-size: 3em; font-weight: bold; color: var(--primary); margin: 2px 0; }
        .modal-controls { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }

        canvas { touch-action: none; width: 100%; max-width: 100%; display: block; }

        .app-footer {
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            font-size: 0.75em;
            opacity: 0.85;
            border-top: 1px dashed var(--border-color);
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 3px;
            align-items: center;
        }
        .app-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: bold;
        }
        .app-footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 850px) {
            .container { grid-template-columns: 1fr; gap: 8px; }
            body { padding: 4px; }
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="app-header">
        <h1>✨ ぷちボイス Studio</h1>
        <p>声で作るおしゃべりスタジオ</p>
        
        <div class="theme-selector-bar">
            <span>🎨</span>
            <button class="theme-btn active" id="theme-light-btn" onclick="setTheme('light')">☀️</button>
            <button class="theme-btn" id="theme-dark-btn" onclick="setTheme('dark')">🌙</button>
            <span style="margin-left:4px;">カラー:</span>
            <span class="color-dot" style="background:#ff758c;" onclick="setColor('pink')" title="ピンク"></span>
            <span class="color-dot" style="background:#3498db;" onclick="setColor('blue')" title="ブルー"></span>
            <span class="color-dot" style="background:#9b59b6;" onclick="setColor('purple')" title="パープル"></span>
            <span class="color-dot" style="background:#2ecc71;" onclick="setColor('green')" title="グリーン"></span>
            <span class="color-dot" style="background:#f1c40f;" onclick="setColor('yellow')" title="イエロー"></span>
            <span class="color-dot" style="background:#e74c3c;" onclick="setColor('red')" title="レッド"></span>
        </div>
    </div>

    <div class="container">
        <!-- 左パネル：ボイスライブラリ作成 -->
        <div class="card">
            <h2 class="card-title">🎤 ボイスライブラリ</h2>
            
            <div class="assist-bar">
                <div class="assist-title">⚡ 録音アシスト</div>
                <div class="assist-buttons">
                    <button class="btn-util" onclick="startContinuousRecording()">🚀 連続録音</button>
                    <button class="btn-util" style="color:#e74c3c; border-color:#ff7875;" onclick="clearAllRecordings()">🗑️ クリア</button>
                </div>
            </div>

            <div class="lib-controls">
                <input type="text" id="lib-icon" value="🎙️" style="padding: 4px; border: 1px solid var(--border-color); background:var(--card-bg); color:var(--text-color); border-radius: 6px; width: 34px; text-align: center; font-size: 0.85em;">
                <input type="text" id="lib-name" value="マイボイス" placeholder="名前" style="padding: 4px; border: 1px solid var(--border-color); background:var(--card-bg); color:var(--text-color); border-radius: 6px; width: 80px; font-size:0.75em;">
                <button class="btn-util" onclick="exportLibrary()">📤 保存</button>
                <button class="btn-util" onclick="document.getElementById('import-file').click()">📥 読込</button>
                <input type="file" id="import-file" accept=".json" style="display:none;" onchange="importLibrary(this)">
            </div>

            <div class="tabs" id="tab-container"></div>

            <div class="grid-container">
                <div class="char-grid" id="char-grid"></div>
            </div>

            <!-- 音素切り出し調整エリア -->
            <div class="trim-panel" id="trim-panel">
                <div class="trim-title">
                    <span id="trim-char-title">✂️ 切り出し調整（未選択）</span>
                    <button class="btn-util" id="btn-preview-trim" onclick="playTrimmedSelected()" disabled style="padding: 2px 6px; font-size:0.7em;">▶ 試聴</button>
                </div>

                <canvas id="trim-waveform" style="height: 60px; background: var(--card-bg); border-radius: 6px; border: 1px solid var(--border-color); margin-top: 4px; margin-bottom: 6px; cursor: pointer;"></canvas>

                <div style="font-size: 0.72em; margin-bottom: 4px; display: flex; align-items: center; gap: 4px;">
                    <input type="checkbox" id="batch-apply-chk" onchange="updateTrimPanelUI()" style="width: 16px; height: 16px; accent-color: var(--primary);">
                    <label for="batch-apply-chk" style="cursor:pointer; font-weight:bold;">🔗 登録済みに一括適用（チェックで数値一括編集）</label>
                </div>
                
                <div class="param-row" style="margin-top: 2px;">
                    <label id="lbl-trim-offset" style="width:75px; font-size:0.72em;">開始位置</label>
                    <input type="range" id="trim-offset" min="0" max="1" step="0.01" value="0.20" oninput="syncTrimInputs('offset', this.value)" disabled>
                    <div style="display:flex; align-items:center; gap:2px;">
                        <input type="number" id="num-trim-offset" min="0" max="2" step="0.01" value="0.20" onchange="syncTrimInputs('offset', this.value)" oninput="syncTrimInputs('offset', this.value)" class="num-input-box" disabled>
                        <span style="font-size:0.72em;">s</span>
                    </div>
                </div>
                <div class="param-row" style="margin-top: 2px;">
                    <label id="lbl-trim-end" style="width:75px; font-size:0.72em;">終了位置</label>
                    <input type="range" id="trim-end" min="0.05" max="1.5" step="0.01" value="0.80" oninput="syncTrimInputs('end', this.value)" disabled>
                    <div style="display:flex; align-items:center; gap:2px;">
                        <input type="number" id="num-trim-end" min="0.05" max="3" step="0.01" value="0.80" onchange="syncTrimInputs('end', this.value)" oninput="syncTrimInputs('end', this.value)" class="num-input-box" disabled>
                        <span style="font-size:0.72em;">s</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右パネル：おしゃべりメーカー -->
        <div class="card">
            <h2 class="card-title">💬 おしゃべりメーカー</h2>

            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                <span style="font-size:0.75em; font-weight:bold;">📝 スロット (最大10個)</span>
                <button class="btn-util" onclick="addSentenceSlot()" style="font-size:0.7em; padding:2px 6px;">＋ 追加</button>
            </div>
            <div class="sentence-tabs" id="sentence-tabs-container"></div>

            <textarea id="talk-text" placeholder="ここに文章を入力。スペースや句読点で間が空きます" oninput="currentSentenceData.text = this.value; syncIntonationNodes(true)"></textarea>

            <div style="margin: 6px 0;">
                <div style="display:flex; justify-content:space-between; align-items:center; font-size:0.75em; font-weight:bold; margin-bottom:4px;">
                    <span>📈 イントネーション <span style="font-size:0.65em; font-weight:normal; opacity:0.7;">(Wタップで初期化)</span></span>
                    <button class="btn-util" onclick="resetIntonationGraph()" style="font-size:0.65em; padding:2px 6px;">リセット</button>
                </div>
                <div style="overflow-x:auto; width:100%; border-radius:8px; border:1px solid var(--border-color); background:var(--card-bg); -webkit-overflow-scrolling: touch;">
                    <div id="intonation-canvas-wrapper" style="min-width:100%; width:100%;">
                        <canvas id="intonation-canvas" style="height:80px; width:100%; cursor:pointer; display:block;"></canvas>
                    </div>
                </div>
            </div>

            <!-- 声の微調整エリア -->
            <div class="param-group">
                <div style="font-weight: bold; font-size: 0.75em; margin-bottom: 2px;">🎛️ パラメータ <span style="font-size:0.65em; font-weight:normal; opacity:0.7;">(Wタップで初期化)</span></div>

                <div class="param-row">
                    <label id="lbl-pitch">ピッチシフト</label>
                    <input type="range" id="param-pitch" min="-12" max="12" step="1" value="0" oninput="updateParamFromUI()">
                    <span class="param-val" id="val-pitch">0</span>
                </div>

                <div class="param-row">
                    <label id="lbl-speed">話すスピード</label>
                    <input type="range" id="param-speed" min="0.1" max="0.5" step="0.02" value="0.20" oninput="updateParamFromUI()">
                    <span class="param-val" id="val-speed">0.20s</span>
                </div>

                <div class="param-row">
                    <label id="lbl-smoothness">滑らかさ</label>
                    <input type="range" id="param-smoothness" min="0" max="100" step="5" value="20" oninput="updateParamFromUI()">
                    <span class="param-val" id="val-smoothness">20%</span>
                </div>

                <div class="param-row">
                    <label id="lbl-tone">トーン</label>
                    <input type="range" id="param-tone" min="-10" max="10" step="1" value="0" oninput="updateParamFromUI()">
                    <span class="param-val" id="val-tone">0</span>
                </div>

                <div class="param-row">
                    <label id="lbl-volume">音量</label>
                    <input type="range" id="param-volume" min="0.1" max="1.5" step="0.1" value="1.0" oninput="updateParamFromUI()">
                    <span class="param-val" id="val-volume">1.0</span>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn-main btn-talk" onclick="speakText()">▶ 喋らせる</button>
                <button class="btn-main btn-save-wav" onclick="exportWav()">💾 保存</button>
            </div>
        </div>
    </div>

    <!-- フッター -->
    <footer class="app-footer">
        <div style="font-weight: bold;">© ぷちボイス</div>
        <div class="credit-text">コーディング: Gemini ｜ サイト提案: <a href="https://x.com/yourei_osirase" target="_blank">ゆーれい</a></div>
    </footer>

    <!-- 連続録音用モーダル -->
    <div class="modal-overlay" id="recording-modal" style="display:none;">
        <div class="modal-box">
            <h3 style="margin:0; font-size:0.95em;">🚀 連続録音</h3>
            <p style="font-size:0.75em; opacity:0.8; margin:3px 0;" id="modal-sub-info">声を出してください</p>
            
            <div class="modal-char" id="modal-char-disp">あ</div>
            <div id="modal-status" style="font-weight:bold; color:var(--primary); font-size:0.8em;">準備中...</div>
            
            <div class="modal-controls">
                <button class="btn-util" id="btn-pause-rec" onclick="togglePauseContinuous()">⏸️ 一時停止</button>
                <button class="btn-util" onclick="prevContinuousStep()">⏮️ 戻る</button>
                <button class="btn-util" onclick="restartContinuousRecording()">🔄 最初から</button>
                <button class="btn-util" style="color:#e74c3c; border-color:#ff7875;" onclick="stopContinuousRecording()">❌ 終了</button>
            </div>
        </div>
    </div>

    <script>
        const phonemeCategories = {
            "あ〜さ行": ["あ","い","う","え","お", "か","き","く","け","こ", "さ","し","す","せ","そ"],
            "た〜ま行": ["た","ち","つ","て","と", "な","に","ぬ","ね","の", "は","ひ","ふ","へ","ほ", "ま","み","む","め","も"],
            "や〜ん": ["や","ゆ","よ", "ら","り","る","れ","ろ", "わ","を","ん"],
            "濁音・半濁音": ["が","ぎ","ぐ","げ","ご", "ざ","じ","ず","ぜ","ぞ", "だ","ぢ","づ","で","ど", "ば","び","ぶ","べ","ぼ", "ぱ","ぴ","ぷ","ぺ","ぽ"],
            "拗音(しゃ等)": [
                "きゃ","きゅ","きょ", "ぎゃ","ぎゅ","ぎょ",
                "しゃ","しゅ","しょ", "じゃ","じゅ","じょ",
                "ちゃ","ちゅ","ちょ",
                "にゃ","にゅ","にょ",
                "ひゃ","ひゅ","ひょ", "びゃ","びゅ","びょ", "ぴゃ","ぴゅ","ぴょ",
                "みゃ","みゅ","みょ",
                "りゃ","りゅ","りょ"
            ]
        };

        const allYouon = Object.values(phonemeCategories["拗音(しゃ等)"]);

        let audioCtx;
        let micStream;
        let voiceLibrary = {}; 
        let currentTab = "あ〜さ行";
        let selectedChar = null;

        let sentences = [
            { text: "あたらしいぶんしょう", nodes: [0, 0, 0, 0, 0, 0, 0, 0, 0], params: { pitch: 0, speed: 0.20, smoothness: 20, tone: 0, volume: 1.0 } }
        ];
        let currentSentenceIdx = 0;
        let currentSentenceData = sentences[0];

        let intonationGraphScale = 1.0;

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            document.getElementById('theme-light-btn').classList.toggle('active', theme === 'light');
            document.getElementById('theme-dark-btn').classList.toggle('active', theme === 'dark');
        }

        function setColor(colorName) {
            document.documentElement.setAttribute('data-color', colorName);
        }

        async function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') await audioCtx.resume();
        }

        async function initMic() {
            if (!micStream) {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            }
        }

        function bindDoubleTapReset(elements, resetFn) {
            elements.forEach(el => {
                if (!el) return;
                let lastTap = 0;
                el.addEventListener('dblclick', (e) => { e.preventDefault(); resetFn(); });
                el.addEventListener('touchend', (e) => {
                    const now = Date.now();
                    if ((now - lastTap) < 300 && (now - lastTap) > 0) {
                        e.preventDefault();
                        resetFn();
                    }
                    lastTap = now;
                });
            });
        }

        function resetParam(elementId, defaultValue) {
            const el = document.getElementById(elementId);
            if (el) {
                el.value = defaultValue;
                updateParamFromUI();
            }
        }

        function resetTrimParam(type) {
            if (type === 'offset') syncTrimInputs('offset', 0.20);
            else if (type === 'end') syncTrimInputs('end', 0.80);
        }

        function setupAllResetHandlers() {
            bindDoubleTapReset([document.getElementById("lbl-pitch"), document.getElementById("param-pitch")], () => resetParam('param-pitch', 0));
            bindDoubleTapReset([document.getElementById("lbl-speed"), document.getElementById("param-speed")], () => resetParam('param-speed', 0.20));
            bindDoubleTapReset([document.getElementById("lbl-smoothness"), document.getElementById("param-smoothness")], () => resetParam('param-smoothness', 20));
            bindDoubleTapReset([document.getElementById("lbl-tone"), document.getElementById("param-tone")], () => resetParam('param-tone', 0));
            bindDoubleTapReset([document.getElementById("lbl-volume"), document.getElementById("param-volume")], () => resetParam('param-volume', 1.0));
            
            bindDoubleTapReset([document.getElementById("lbl-trim-offset"), document.getElementById("trim-offset")], () => resetTrimParam('offset'));
            bindDoubleTapReset([document.getElementById("lbl-trim-end"), document.getElementById("trim-end")], () => resetTrimParam('end'));
        }

        function renderUI() {
            const tabContainer = document.getElementById("tab-container");
            tabContainer.innerHTML = "";

            Object.keys(phonemeCategories).forEach(cat => {
                const btn = document.createElement("button");
                btn.className = `tab-btn ${cat === currentTab ? 'active' : ''}`;
                btn.textContent = cat;
                btn.onclick = () => { currentTab = cat; renderUI(); };
                tabContainer.appendChild(btn);
            });

            const grid = document.getElementById("char-grid");
            grid.innerHTML = "";
            phonemeCategories[currentTab].forEach(char => {
                const item = voiceLibrary[char];
                const isRecorded = !!item;
                const isSelected = selectedChar === char;

                const card = document.createElement("div");
                card.className = `char-card ${isRecorded ? 'recorded' : ''} ${isSelected ? 'selected' : ''}`;
                card.innerHTML = `
                    <div class="char-name">${char}</div>
                    <button id="rec-${char}" class="btn-mini btn-rec" onclick="record('${char}')">録音</button>
                    <button id="play-${char}" class="btn-mini btn-play" onclick="playTrimmedChar('${char}')" ${isRecorded ? '' : 'disabled'}>▶</button>
                    <button id="trim-${char}" class="btn-mini btn-trim" onclick="selectForTrim('${char}')" ${isRecorded ? '' : 'disabled'}>⚙️</button>
                `;
                grid.appendChild(card);
            });

            renderSentenceTabs();
            updateTrimPanelUI();
        }

        function renderSentenceTabs() {
            const container = document.getElementById("sentence-tabs-container");
            container.innerHTML = "";
            sentences.forEach((s, idx) => {
                const btn = document.createElement("button");
                btn.className = `sentence-tab ${idx === currentSentenceIdx ? 'active' : ''}`;
                btn.textContent = `${idx + 1}: ${s.text.substring(0, 4) || '(空)'}`;
                btn.onclick = () => switchSentenceSlot(idx);
                container.appendChild(btn);
            });
        }

        function addSentenceSlot() {
            if (sentences.length >= 10) {
                alert("文章スロットは最大10個までです。");
                return;
            }
            sentences.push({
                text: "あたらしいぶんしょう",
                nodes: [0, 0, 0, 0, 0, 0, 0, 0, 0],
                params: { pitch: 0, speed: 0.20, smoothness: 20, tone: 0, volume: 1.0 }
            });
            switchSentenceSlot(sentences.length - 1);
        }

        function switchSentenceSlot(idx) {
            currentSentenceIdx = idx;
            currentSentenceData = sentences[idx];
            document.getElementById("talk-text").value = currentSentenceData.text;
            applyParamsToUI(currentSentenceData.params);
            syncIntonationNodes(true);
            renderSentenceTabs();
        }

        function applyParamsToUI(p) {
            document.getElementById("param-pitch").value = p.pitch;
            document.getElementById("param-speed").value = p.speed;
            document.getElementById("param-smoothness").value = p.smoothness;
            document.getElementById("param-tone").value = p.tone;
            document.getElementById("param-volume").value = p.volume;
            updateParamDisp();
        }

        function updateParamFromUI() {
            currentSentenceData.params = {
                pitch: parseFloat(document.getElementById("param-pitch").value),
                speed: parseFloat(document.getElementById("param-speed").value),
                smoothness: parseFloat(document.getElementById("param-smoothness").value),
                tone: parseFloat(document.getElementById("param-tone").value),
                volume: parseFloat(document.getElementById("param-volume").value)
            };
            updateParamDisp();
        }

        function updateParamDisp() {
            const p = currentSentenceData.params;
            document.getElementById("val-pitch").textContent = p.pitch;
            document.getElementById("val-speed").textContent = p.speed + "s";
            document.getElementById("val-smoothness").textContent = p.smoothness + "%";
            document.getElementById("val-tone").textContent = p.tone;
            document.getElementById("val-volume").textContent = p.volume;
        }

        function record(char) {
            return new Promise(async (resolve) => {
                await initAudio();
                await initMic();
                const recBtn = document.getElementById(`rec-${char}`);
                if (recBtn && recBtn.disabled) return resolve();

                const mediaRecorder = new MediaRecorder(micStream);
                const chunks = [];
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(chunks);
                    const buffer = await blob.arrayBuffer();
                    const audioBuffer = await audioCtx.decodeAudioData(buffer);
                    
                    const initialOffset = Math.min(0.20, audioBuffer.duration * 0.2);
                    const initialDuration = Math.min(0.60, Math.max(0.1, audioBuffer.duration - initialOffset));

                    voiceLibrary[char] = {
                        buffer: audioBuffer,
                        offset: parseFloat(initialOffset.toFixed(2)),
                        duration: parseFloat(initialDuration.toFixed(2))
                    };

                    if (recBtn) { recBtn.textContent = "録音"; recBtn.classList.remove("recording"); recBtn.disabled = false; }
                    selectForTrim(char);
                    renderUI();
                    saveToLocalStorage(true);
                    resolve();
                };

                mediaRecorder.start();
                if (recBtn) { recBtn.textContent = "録音中"; recBtn.classList.add("recording"); recBtn.disabled = true; }
                setTimeout(() => { if (mediaRecorder.state === "recording") mediaRecorder.stop(); }, 1200);
            });
        }

        function clearAllRecordings() {
            if (confirm("すべての録音データを消去してリセットしますか？")) {
                voiceLibrary = {};
                selectedChar = null;
                localStorage.removeItem("puchivoice_saved_library");
                renderUI();
            }
        }

        let isContinuousRunning = false;
        let isContinuousPaused = false;
        let continuousIndex = 0;
        let continuousTargets = [];

        async function startContinuousRecording() {
            await initAudio();
            await initMic();
            isContinuousRunning = true;
            isContinuousPaused = false;
            continuousIndex = 0;
            continuousTargets = phonemeCategories[currentTab];
            document.getElementById("recording-modal").style.display = "flex";
            runContinuousLoop();
        }

        async function runContinuousLoop() {
            while (isContinuousRunning && continuousIndex < continuousTargets.length) {
                if (isContinuousPaused) { await new Promise(r => setTimeout(r, 200)); continue; }
                const char = continuousTargets[continuousIndex];
                document.getElementById("modal-char-disp").textContent = char;
                document.getElementById("modal-sub-info").textContent = `進捗: ${continuousIndex + 1} / ${continuousTargets.length}`;
                
                // 1. 録音フェーズ (約1.2秒)
                document.getElementById("modal-status").textContent = "🎙️ 録音中...";
                document.getElementById("modal-status").style.color = "var(--primary)";
                await record(char);

                if (!isContinuousRunning) break;

                // 2. 休憩フェーズ (録音と同じ長さ: 1.2秒)
                document.getElementById("modal-status").textContent = "☕ 休憩中...";
                document.getElementById("modal-status").style.color = "var(--accent-orange)";
                
                let pauseLeft = 1200;
                while (pauseLeft > 0 && isContinuousRunning) {
                    if (!isContinuousPaused) {
                        await new Promise(r => setTimeout(r, 200));
                        pauseLeft -= 200;
                    } else {
                        await new Promise(r => setTimeout(r, 200));
                    }
                }

                if (!isContinuousPaused && isContinuousRunning) continuousIndex++;
            }
            if (continuousIndex >= continuousTargets.length && isContinuousRunning) {
                alert("🎉 このタブの連続録音が完了しました！");
                stopContinuousRecording();
            }
        }

        function togglePauseContinuous() {
            isContinuousPaused = !isContinuousPaused;
            document.getElementById("btn-pause-rec").textContent = isContinuousPaused ? "▶️ 再開" : "⏸️ 一時停止";
        }
        function prevContinuousStep() { if (continuousIndex > 0) continuousIndex--; }
        function restartContinuousRecording() { continuousIndex = 0; isContinuousPaused = false; }
        function stopContinuousRecording() { isContinuousRunning = false; document.getElementById("recording-modal").style.display = "none"; }

        function selectForTrim(char) {
            if (!voiceLibrary[char]) return;
            selectedChar = char;
            renderUI();
            drawTrimWaveform();
        }

        function updateTrimPanelUI() {
            const title = document.getElementById("trim-char-title");
            const offInput = document.getElementById("trim-offset");
            const offNum = document.getElementById("num-trim-offset");
            const endInput = document.getElementById("trim-end");
            const endNum = document.getElementById("num-trim-end");
            const btnPrev = document.getElementById("btn-preview-trim");
            const isBatch = document.getElementById("batch-apply-chk").checked;
            const hasRecordings = Object.keys(voiceLibrary).length > 0;

            if (selectedChar && voiceLibrary[selectedChar]) {
                const item = voiceLibrary[selectedChar];
                title.textContent = `✂️ 「${selectedChar}」の微調整${isBatch ? '（一括適用中）' : ''}`;
                offInput.disabled = false; offNum.disabled = false;
                endInput.disabled = false; endNum.disabled = false;
                btnPrev.disabled = false;
                
                const totalDur = item.buffer.duration;
                offInput.max = (totalDur - 0.05).toFixed(2);
                offInput.value = item.offset;
                offNum.value = Number(item.offset).toFixed(2);
                
                endInput.min = (item.offset + 0.05).toFixed(2);
                endInput.max = totalDur.toFixed(2);
                const currentEnd = item.offset + item.duration;
                endInput.value = currentEnd.toFixed(2);
                endNum.value = Number(currentEnd).toFixed(2);
            } else if (isBatch && hasRecordings) {
                title.textContent = `✂️ 全音素の切り出し一括調整`;
                offInput.disabled = false; offNum.disabled = false;
                endInput.disabled = false; endNum.disabled = false;
                btnPrev.disabled = true;
            } else {
                title.textContent = `✂️ 切り出し調整（未選択）`;
                offInput.disabled = true; offNum.disabled = true;
                endInput.disabled = true; endNum.disabled = true;
                btnPrev.disabled = true;
            }
            drawTrimWaveform();
        }

        function syncTrimInputs(type, val) {
            const num = parseFloat(val);
            if (isNaN(num)) return;

            const offInput = document.getElementById("trim-offset");
            const offNum = document.getElementById("num-trim-offset");
            const endInput = document.getElementById("trim-end");
            const endNum = document.getElementById("num-trim-end");

            if (type === 'offset') {
                offInput.value = num;
                offNum.value = num.toFixed(2);
            } else if (type === 'end') {
                endInput.value = num;
                endNum.value = num.toFixed(2);
            }

            updateTrimParams();
        }

        function updateTrimParams() {
            const offVal = parseFloat(document.getElementById("trim-offset").value) || 0;
            const endVal = parseFloat(document.getElementById("trim-end").value) || 0.8;
            const isBatch = document.getElementById("batch-apply-chk").checked;

            const newDur = Math.max(0.05, endVal - offVal);

            document.getElementById("num-trim-offset").value = offVal.toFixed(2);
            document.getElementById("num-trim-end").value = endVal.toFixed(2);

            if (isBatch) {
                for (const char in voiceLibrary) {
                    if (voiceLibrary[char]) {
                        const item = voiceLibrary[char];
                        item.offset = Math.min(offVal, item.buffer.duration - 0.05);
                        item.duration = Math.min(newDur, item.buffer.duration - item.offset);
                    }
                }
            } else if (selectedChar && voiceLibrary[selectedChar]) {
                voiceLibrary[selectedChar].offset = offVal;
                voiceLibrary[selectedChar].duration = newDur;
            }
            saveToLocalStorage(true);
            drawTrimWaveform();
        }

        function playTrimmedSelected() { if (selectedChar) playTrimmedChar(selectedChar); }
        
        function playTrimmedChar(char) {
            initAudio();
            const item = voiceLibrary[char];
            if (!item) return;
            
            const trimmedBuffer = getTrimmedBuffer(audioCtx, item.buffer, item.offset, item.duration);
            const src = audioCtx.createBufferSource();
            src.buffer = trimmedBuffer;
            
            const pitchShift = currentSentenceData ? currentSentenceData.params.pitch : 0;
            src.playbackRate.value = Math.pow(2, pitchShift / 12);

            const compressor = audioCtx.createDynamicsCompressor();
            compressor.threshold.setValueAtTime(-20, audioCtx.currentTime);
            compressor.knee.setValueAtTime(20, audioCtx.currentTime);
            compressor.ratio.setValueAtTime(8, audioCtx.currentTime);
            compressor.attack.setValueAtTime(0.005, audioCtx.currentTime);
            compressor.release.setValueAtTime(0.1, audioCtx.currentTime);

            src.connect(compressor);
            compressor.connect(audioCtx.destination);
            src.start();
        }

        function getTrimmedBuffer(ctx, origBuffer, offset, duration) {
            const sr = origBuffer.sampleRate;
            const startSample = Math.floor(offset * sr);
            const lengthSamples = Math.floor(duration * sr);
            const actualLength = Math.max(1, Math.min(lengthSamples, origBuffer.length - startSample));
            const newBuf = ctx.createBuffer(origBuffer.numberOfChannels, actualLength, sr);
            for (let ch = 0; ch < origBuffer.numberOfChannels; ch++) {
                newBuf.getChannelData(ch).set(origBuffer.getChannelData(ch).subarray(startSample, startSample + actualLength));
            }
            return newBuf;
        }

        let isDraggingWaveform = false;
        let dragTarget = null;

        function drawTrimWaveform() {
            const canvas = document.getElementById("trim-waveform");
            if (!canvas) return;
            const ctx = canvas.getContext("2d");
            const rect = canvas.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) return;

            canvas.width = rect.width * (window.devicePixelRatio || 1);
            canvas.height = rect.height * (window.devicePixelRatio || 1);
            ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);

            const w = rect.width;
            const h = rect.height;
            ctx.clearRect(0, 0, w, h);

            if (!selectedChar || !voiceLibrary[selectedChar]) {
                ctx.fillStyle = "#888";
                ctx.font = "11px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("音素を選ぶと波形が表示されます", w / 2, h / 2 + 4);
                return;
            }

            const item = voiceLibrary[selectedChar];
            const data = item.buffer.getChannelData(0);
            const totalDuration = item.buffer.duration;

            ctx.fillStyle = "#ffb8c6";
            const step = Math.ceil(data.length / w);
            const amp = h / 2;
            for (let i = 0; i < w; i++) {
                let min = 1.0, max = -1.0;
                for (let j = 0; j < step; j++) {
                    const datum = data[(i * step) + j];
                    if (datum < min) min = datum;
                    if (datum > max) max = datum;
                }
                ctx.fillRect(i, (1 + min) * amp, 1, Math.max(1, (max - min) * amp));
            }

            const startX = (item.offset / totalDuration) * w;
            const endX = Math.min(w, ((item.offset + item.duration) / totalDuration) * w);

            ctx.fillStyle = "rgba(112, 161, 255, 0.3)";
            ctx.fillRect(startX, 0, endX - startX, h);

            ctx.strokeStyle = "#a55eea"; ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.moveTo(startX, 0); ctx.lineTo(startX, h); ctx.stroke();

            ctx.fillStyle = "#a55eea";
            ctx.font = "bold 9px sans-serif";
            ctx.textAlign = "right";
            ctx.fillText("開始位置", Math.max(45, startX - 4), 12);

            ctx.strokeStyle = "#ff4757"; ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.moveTo(endX, 0); ctx.lineTo(endX, h); ctx.stroke();

            ctx.fillStyle = "#ff4757";
            ctx.textAlign = "left";
            ctx.fillText("終了位置", Math.min(w - 45, endX + 4), h - 6);
        }

        function setupWaveformEvents() {
            const canvas = document.getElementById("trim-waveform");
            if (!canvas) return;
            const handlePointer = (e) => {
                if (!selectedChar || !voiceLibrary[selectedChar]) return;
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const x = Math.max(0, Math.min(rect.width, clientX - rect.left));
                const ratio = x / rect.width;
                const item = voiceLibrary[selectedChar];
                const totalDur = item.buffer.duration;
                const targetTime = ratio * totalDur;

                const startX = (item.offset / totalDur) * rect.width;
                const endX = ((item.offset + item.duration) / totalDur) * rect.width;

                if (e.type === 'mousedown' || e.type === 'touchstart') {
                    isDraggingWaveform = true;
                    if (Math.abs(x - startX) < 20) dragTarget = 'start';
                    else if (Math.abs(x - endX) < 20) dragTarget = 'end';
                    else if (x < startX) dragTarget = 'start';
                    else dragTarget = 'end';
                }

                if (isDraggingWaveform) {
                    if (dragTarget === 'start') {
                        const newOffset = Math.min(targetTime, totalDur - 0.05);
                        const currentEnd = item.offset + item.duration;
                        item.offset = parseFloat(newOffset.toFixed(2));
                        item.duration = currentEnd > item.offset ? parseFloat((currentEnd - item.offset).toFixed(2)) : 0.05;
                    } else if (dragTarget === 'end') {
                        const newEnd = Math.max(targetTime, item.offset + 0.05);
                        item.duration = parseFloat((Math.min(totalDur, newEnd) - item.offset).toFixed(2));
                    }
                    updateTrimPanelUI();
                    updateTrimParams();
                }
            };
            const stopDrag = () => { isDraggingWaveform = false; dragTarget = null; };
            canvas.addEventListener('mousedown', handlePointer);
            canvas.addEventListener('mousemove', (e) => { if (isDraggingWaveform) handlePointer(e); });
            window.addEventListener('mouseup', stopDrag);
            canvas.addEventListener('touchstart', handlePointer, { passive: true });
            canvas.addEventListener('touchmove', (e) => { if (isDraggingWaveform) handlePointer(e); }, { passive: true });
            window.addEventListener('touchend', stopDrag);
        }

        // カタカナを平仮名に変換
        function toHiragana(str) {
            return str.replace(/[\u30a1-\u30f6]/g, function(match) {
                var chr = match.charCodeAt(0) - 0x60;
                return String.fromCharCode(chr);
            });
        }

        // テキストをトークン化（長音符「ー」は前の音の長さを拡張）
        function parseText(text) {
            const result = [];
            let i = 0;
            while (i < text.length) {
                let char = text[i];
                
                if (i < text.length - 1) {
                    const two = text.substring(i, i + 2);
                    const hTwo = toHiragana(two);
                    if (allYouon.includes(hTwo)) {
                        char = two;
                        i += 2;
                    } else {
                        i += 1;
                    }
                } else {
                    i += 1;
                }

                // 長音符（ー）の場合は直前の発声音素の音長（length）を伸ばす
                if (["ー", "―", "ｰ"].includes(char)) {
                    let lastVoiced = null;
                    for (let j = result.length - 1; j >= 0; j--) {
                        if (result[j].type === 'voice') {
                            lastVoiced = result[j];
                            break;
                        }
                    }
                    if (lastVoiced) {
                        lastVoiced.length += 1;
                        lastVoiced.display += char;
                    }
                    continue;
                }

                if ([" ", " ", "、", "。", "！", "？", "\n", "っ", "ッ"].includes(char)) {
                    result.push({ type: 'pause', char: char, length: 1 });
                } else {
                    const hChar = toHiragana(char);
                    result.push({ type: 'voice', char: hChar, display: char, length: 1 });
                }
            }
            return result;
        }

        function parseVoicedTokens(text) {
            return parseText(text).filter(t => t.type === 'voice');
        }

        // イントネーションノードの同期（全0で初期化してまっすぐの直線を作成）
        function syncIntonationNodes(forceReset = false) {
            const text = currentSentenceData ? currentSentenceData.text : "";
            const tokens = parseVoicedTokens(text);

            if (tokens.length === 0) {
                currentSentenceData.nodes = [];
            } else {
                if (forceReset || !currentSentenceData.nodes || currentSentenceData.nodes.length !== tokens.length) {
                    currentSentenceData.nodes = new Array(tokens.length).fill(0);
                }
            }
            drawIntonationGraph();
        }

        // イントネーションのリセット（すべて0に初期化）
        function resetIntonationGraph() {
            syncIntonationNodes(true);
        }

        function drawIntonationGraph() {
            const canvas = document.getElementById("intonation-canvas");
            const wrapper = document.getElementById("intonation-canvas-wrapper");
            if (!canvas || !wrapper) return;

            const text = currentSentenceData ? currentSentenceData.text : "";
            const tokens = parseVoicedTokens(text);

            const minWidthPerChar = 44;
            const parentContainer = wrapper.parentElement;
            const parentW = (parentContainer && parentContainer.clientWidth > 0) 
                ? parentContainer.clientWidth 
                : (wrapper.clientWidth || 300);
            const calculatedWidth = Math.max(parentW, tokens.length * minWidthPerChar);
            
            canvas.style.width = calculatedWidth + "px";
            wrapper.style.width = calculatedWidth + "px";

            const ctx = canvas.getContext("2d");
            const dpr = window.devicePixelRatio || 1;
            const h = 80;
            
            canvas.width = Math.floor(calculatedWidth * dpr);
            canvas.height = Math.floor(h * dpr);
            ctx.scale(dpr, dpr);

            const w = calculatedWidth;
            ctx.clearRect(0, 0, w, h);

            if (tokens.length === 0) {
                ctx.fillStyle = "#888";
                ctx.font = "11px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("文章を入力するとイントネーションが表示されます", w / 2, h / 2 + 4);
                return;
            }

            const centerY = h / 2;
            // 基準の中心線（薄い点線）
            ctx.strokeStyle = "rgba(150,150,150,0.3)";
            ctx.setLineDash([3, 3]);
            ctx.beginPath(); ctx.moveTo(0, centerY); ctx.lineTo(w, centerY); ctx.stroke();
            ctx.setLineDash([]);

            if (!currentSentenceData.nodes || currentSentenceData.nodes.length !== tokens.length) {
                currentSentenceData.nodes = new Array(tokens.length).fill(0);
            }

            const points = [];
            const padding = 30;
            const availableW = Math.max(50, w - padding * 2);
            const maxRange = 8;

            for (let i = 0; i < tokens.length; i++) {
                const px = tokens.length === 1 ? w / 2 : padding + (i / (tokens.length - 1)) * availableW;
                const pitchVal = (currentSentenceData.nodes && typeof currentSentenceData.nodes[i] === 'number') ? currentSentenceData.nodes[i] : 0;
                const py = centerY - ((pitchVal / maxRange) * (h / 2 - 14) * intonationGraphScale);
                points.push({ x: px, y: py, char: tokens[i].display, val: pitchVal });
            }

            // グラフの直線を描画（端から端までまっすぐ繋ぐ）
            ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim() || '#ff758c';
            ctx.lineWidth = 2.5;
            ctx.beginPath();

            if (points.length === 1) {
                ctx.moveTo(0, points[0].y); 
                ctx.lineTo(w, points[0].y);
            } else {
                ctx.moveTo(0, points[0].y);
                ctx.lineTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) {
                    ctx.lineTo(points[i].x, points[i].y);
                }
                ctx.lineTo(w, points[points.length - 1].y);
            }
            ctx.stroke();

            // ノードとテキスト文字を描画
            points.forEach((p) => {
                ctx.fillStyle = ctx.strokeStyle;
                ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();

                ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-color').trim() || '#4a4a4a';
                ctx.font = "bold 10px sans-serif"; ctx.textAlign = "center";
                ctx.fillText(p.char, p.x, p.y < centerY ? p.y - 7 : p.y + 14);
            });
        }

        let activeNodeIdx = -1;

        function setupIntonationEvents() {
            const canvas = document.getElementById("intonation-canvas");
            if (!canvas) return;

            const handlePointer = (e) => {
                const tokens = parseVoicedTokens(currentSentenceData.text);
                if (tokens.length === 0) return;

                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const x = clientX - rect.left;
                const y = clientY - rect.top;

                const w = rect.width;
                const h = rect.height;
                const centerY = h / 2;
                const padding = 30;
                const availableW = Math.max(50, w - padding * 2);
                const maxRange = 8;

                if (e.type === 'mousedown' || e.type === 'touchstart') {
                    let minDist = Infinity;
                    let closest = -1;
                    for (let i = 0; i < tokens.length; i++) {
                        const px = tokens.length === 1 ? w / 2 : padding + (i / (tokens.length - 1)) * availableW;
                        const dist = Math.abs(x - px);
                        if (dist < minDist) { minDist = dist; closest = i; }
                    }
                    if (minDist < 45) activeNodeIdx = closest;
                }

                if (activeNodeIdx !== -1 && activeNodeIdx < tokens.length) {
                    const deltaY = centerY - y;
                    let pitchVal = (deltaY / ((h / 2 - 14) * intonationGraphScale)) * maxRange;
                    pitchVal = Math.max(-8, Math.min(8, pitchVal));
                    currentSentenceData.nodes[activeNodeIdx] = parseFloat(pitchVal.toFixed(1));
                    drawIntonationGraph();
                }
            };

            const handleDoubleClick = (e) => {
                const tokens = parseVoicedTokens(currentSentenceData.text);
                if (tokens.length === 0) return;

                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const w = rect.width;
                const padding = 30;
                const availableW = Math.max(50, w - padding * 2);

                let minDist = Infinity;
                let closest = -1;
                for (let i = 0; i < tokens.length; i++) {
                    const px = tokens.length === 1 ? w / 2 : padding + (i / (tokens.length - 1)) * availableW;
                    const dist = Math.abs(x - px);
                    if (dist < minDist) { minDist = dist; closest = i; }
                }

                if (minDist < 35 && closest !== -1) {
                    currentSentenceData.nodes[closest] = 0;
                    drawIntonationGraph();
                }
            };

            const stopDrag = () => { activeNodeIdx = -1; };
            canvas.addEventListener('mousedown', handlePointer);
            canvas.addEventListener('mousemove', (e) => { if (activeNodeIdx !== -1) handlePointer(e); });
            window.addEventListener('mouseup', stopDrag);
            canvas.addEventListener('dblclick', handleDoubleClick);
            canvas.addEventListener('touchstart', handlePointer, { passive: true });
            canvas.addEventListener('touchmove', (e) => { if (activeNodeIdx !== -1) handlePointer(e); }, { passive: true });
            window.addEventListener('touchend', stopDrag);
        }

        function fallbackChar(c) {
            const map = {
                'が':'か','ぎ':'き','ぐ':'く','げ':'け','ご':'こ',
                'ざ':'さ','じ':'し','ず':'す','ぜ':'せ','ぞ':'そ',
                'だ':'た','ぢ':'ち','づ':'つ','で':'て','ど':'と',
                'ば':'は','び':'ひ','ぶ':'ふ','べ':'へ','ぼ':'ほ',
                'ぱ':'は','ぴ':'ひ','ぷ':'ふ','ぺ':'へ','ぽ':'ほ',
                'ぁ':'あ','ぃ':'い','ぅ':'う','ぇ':'え','ぉ':'お',
                'ゃ':'や','ゅ':'ゆ','ょ':'よ'
            };
            return map[c] || 'あ';
        }

        function scheduleSpeechNode(ctx, destination, char, startTime, playDuration, opts, nodeIdx) {
            let item = voiceLibrary[char];
            if (!item) item = voiceLibrary[fallbackChar(char)];
            if (!item) return;

            const trimmedBuf = getTrimmedBuffer(ctx, item.buffer, item.offset, item.duration);
            const src = ctx.createBufferSource();
            src.buffer = trimmedBuf;

            const customShift = (currentSentenceData.nodes && currentSentenceData.nodes[nodeIdx] !== undefined) ? currentSentenceData.nodes[nodeIdx] : 0;
            const nextShift = (currentSentenceData.nodes && currentSentenceData.nodes[nodeIdx + 1] !== undefined) ? currentSentenceData.nodes[nodeIdx + 1] : customShift;

            const startRate = Math.pow(2, (opts.pitch + customShift) / 12);
            const endRate = Math.pow(2, (opts.pitch + nextShift) / 12);

            src.playbackRate.setValueAtTime(startRate, startTime);
            if (startRate !== endRate) {
                src.playbackRate.linearRampToValueAtTime(endRate, startTime + playDuration);
            }

            let lastNode = src;
            if (opts.tone !== 0) {
                const filter = ctx.createBiquadFilter();
                if (opts.tone > 0) { filter.type = "peaking"; filter.frequency.value = 3200; filter.gain.value = opts.tone * 1.2; }
                else { filter.type = "lowpass"; filter.frequency.value = Math.max(500, 3500 + opts.tone * 250); }
                src.connect(filter); lastNode = filter;
            }

            const gainNode = ctx.createGain();
            const smoothRatio = opts.smoothness / 100;
            const overlap = 0.08 * smoothRatio;
            const attack = Math.min(0.03 * Math.max(0.1, smoothRatio), playDuration * 0.2);
            const release = Math.min(0.06 * Math.max(0.1, smoothRatio), playDuration * 0.4);

            gainNode.gain.setValueAtTime(0, startTime);
            gainNode.gain.linearRampToValueAtTime(opts.volume, startTime + attack);
            gainNode.gain.setValueAtTime(opts.volume, startTime + playDuration - release);
            gainNode.gain.linearRampToValueAtTime(0, startTime + playDuration + overlap);

            const compressor = ctx.createDynamicsCompressor();
            compressor.threshold.setValueAtTime(-20, startTime);
            compressor.knee.setValueAtTime(20, startTime);
            compressor.ratio.setValueAtTime(8, startTime);
            compressor.attack.setValueAtTime(0.005, startTime);
            compressor.release.setValueAtTime(0.1, startTime);

            lastNode.connect(gainNode);
            gainNode.connect(compressor);
            compressor.connect(destination);

            src.start(startTime);
            src.stop(startTime + playDuration + overlap + 0.01);
        }

        async function speakText() {
            await initAudio();
            const text = currentSentenceData.text;
            const tokens = parseText(text);
            const opts = currentSentenceData.params;

            let currentTime = audioCtx.currentTime + 0.05;
            let voicedIndex = 0;
            const overlapTime = (opts.speed * 0.45) * (opts.smoothness / 100);

            tokens.forEach((token) => {
                if (token.type === 'pause') {
                    const char = token.char;
                    if ([" ", " "].includes(char)) { currentTime += opts.speed * 1.2; return; }
                    if (char === "、") { currentTime += opts.speed * 1.2; return; }
                    if (["。", "！", "？"].includes(char)) { currentTime += opts.speed * 2.2; return; }
                    if (char === "\n") { currentTime += opts.speed * 2.0; return; }
                    if (["っ", "ッ"].includes(char)) { currentTime += opts.speed * 0.6; return; }
                    return;
                }

                const playDuration = opts.speed * token.length;
                scheduleSpeechNode(audioCtx, audioCtx.destination, token.char, currentTime, playDuration, opts, voicedIndex);
                currentTime += Math.max(0.02, playDuration - overlapTime);
                voicedIndex++;
            });
        }

        async function exportWav() {
            await initAudio();
            const text = currentSentenceData.text;
            const tokens = parseText(text);
            if (tokens.filter(t => t.type === 'voice').length === 0) return alert("文章を入力してください。");

            const opts = currentSentenceData.params;
            const sampleRate = 44100;
            const overlapTime = (opts.speed * 0.45) * (opts.smoothness / 100);

            let totalDuration = 0.5;
            tokens.forEach(token => {
                if (token.type === 'pause') {
                    const char = token.char;
                    if ([" ", " "].includes(char)) totalDuration += opts.speed * 1.2;
                    else if (char === "、") totalDuration += opts.speed * 1.2;
                    else if (["。", "！", "？"].includes(char)) totalDuration += opts.speed * 2.2;
                    else if (char === "\n") totalDuration += opts.speed * 2.0;
                    else if (["っ", "ッ"].includes(char)) totalDuration += opts.speed * 0.6;
                } else {
                    const playDuration = opts.speed * token.length;
                    totalDuration += Math.max(0.02, playDuration - overlapTime);
                }
            });

            const offlineCtx = new OfflineAudioContext(1, Math.ceil(sampleRate * (totalDuration + 0.2)), sampleRate);
            let currentTime = 0.05;
            let voicedIndex = 0;

            tokens.forEach((token) => {
                if (token.type === 'pause') {
                    const char = token.char;
                    if ([" ", " "].includes(char)) { currentTime += opts.speed * 1.2; return; }
                    if (char === "、") { currentTime += opts.speed * 1.2; return; }
                    if (["。", "！", "？"].includes(char)) { currentTime += opts.speed * 2.2; return; }
                    if (char === "\n") { currentTime += opts.speed * 2.0; return; }
                    if (["っ", "ッ"].includes(char)) { currentTime += opts.speed * 0.6; return; }
                    return;
                }

                const playDuration = opts.speed * token.length;
                scheduleSpeechNode(offlineCtx, offlineCtx.destination, token.char, currentTime, playDuration, opts, voicedIndex);
                currentTime += Math.max(0.02, playDuration - overlapTime);
                voicedIndex++;
            });

            const renderedBuffer = await offlineCtx.startRendering();
            const wavBlob = bufferToWavBlob(renderedBuffer);
            const url = URL.createObjectURL(wavBlob);
            const a = document.createElement("a");
            a.href = url; a.download = `voice_${Date.now()}.wav`; a.target = "_blank";
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 20000);
        }

        function bufferToWavBlob(buffer) {
            const numChannels = 1, sampleRate = buffer.sampleRate, format = 1, bitDepth = 16;
            const samples = buffer.getChannelData(0);
            const bytesPerSample = bitDepth / 8;
            const blockAlign = numChannels * bytesPerSample;
            const dataByteCount = samples.length * bytesPerSample;
            const headerByteCount = 44;
            const arrayBuffer = new ArrayBuffer(headerByteCount + dataByteCount);
            const view = new DataView(arrayBuffer);
            const writeString = (offset, str) => { for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i)); };

            writeString(0, 'RIFF'); view.setUint32(4, 36 + dataByteCount, true);
            writeString(8, 'WAVE'); writeString(12, 'fmt ');
            view.setUint32(16, 16, true); view.setUint16(20, format, true);
            view.setUint16(22, numChannels, true); view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * blockAlign, true); view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitDepth, true); writeString(36, 'data');
            view.setUint32(40, dataByteCount, true);

            let offset = 44;
            for (let i = 0; i < samples.length; i++) {
                const s = Math.max(-1, Math.min(1, samples[i]));
                view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
                offset += 2;
            }
            return new Blob([arrayBuffer], { type: 'audio/wav' });
        }

        async function saveToLocalStorage(silent = false) {
            const icon = document.getElementById("lib-icon").value || "🎙️";
            const name = document.getElementById("lib-name").value || "マイボイス";
            const saveObj = { icon: icon, name: name, samples: {}, sentences: sentences };

            for (const char in voiceLibrary) {
                if (voiceLibrary[char]) {
                    const blob = bufferToWavBlob(voiceLibrary[char].buffer);
                    saveObj.samples[char] = {
                        data: await blobToBase64(blob),
                        offset: voiceLibrary[char].offset,
                        duration: voiceLibrary[char].duration
                    };
                }
            }
            try { localStorage.setItem("puchivoice_saved_library", JSON.stringify(saveObj)); } catch (e) {}
        }

        async function loadFromLocalStorage() {
            const saved = localStorage.getItem("puchivoice_saved_library");
            if (!saved) return false;
            try {
                const data = JSON.parse(saved);
                if (data.icon) document.getElementById("lib-icon").value = data.icon;
                if (data.name) document.getElementById("lib-name").value = data.name;
                if (data.sentences && Array.isArray(data.sentences)) {
                    sentences = data.sentences;
                    currentSentenceIdx = 0;
                    currentSentenceData = sentences[0];
                }

                await initAudio();
                voiceLibrary = {}; selectedChar = null;
                for (const char in data.samples) {
                    const sampleInfo = data.samples[char];
                    const res = await fetch(sampleInfo.data);
                    const ab = await res.arrayBuffer();
                    const audioBuffer = await audioCtx.decodeAudioData(ab);
                    voiceLibrary[char] = {
                        buffer: audioBuffer,
                        offset: sampleInfo.offset !== undefined ? sampleInfo.offset : 0.20,
                        duration: sampleInfo.duration || 0.60
                    };
                }
                renderUI();
                switchSentenceSlot(0);
                return true;
            } catch (e) { return false; }
        }

        async function exportLibrary() {
            const icon = document.getElementById("lib-icon").value || "🎙️";
            const name = document.getElementById("lib-name").value || "マイボイス";
            const exportData = { icon: icon, name: name, samples: {}, sentences: sentences };
            for (const char in voiceLibrary) {
                if (voiceLibrary[char]) {
                    const blob = bufferToWavBlob(voiceLibrary[char].buffer);
                    exportData.samples[char] = {
                        data: await blobToBase64(blob),
                        offset: voiceLibrary[char].offset,
                        duration: voiceLibrary[char].duration
                    };
                }
            }
            const blob = new Blob([JSON.stringify(exportData)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a"); a.href = url; a.download = `${name}_voice_library.json`; a.target = "_blank";
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 20000);
        }

        function blobToBase64(blob) {
            return new Promise(resolve => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.readAsDataURL(blob);
            });
        }

        function importLibrary(fileInput) {
            const file = fileInput.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.icon) document.getElementById("lib-icon").value = data.icon;
                    if (data.name) document.getElementById("lib-name").value = data.name;
                    if (data.sentences) { sentences = data.sentences; currentSentenceIdx = 0; currentSentenceData = sentences[0]; }

                    await initAudio();
                    voiceLibrary = {}; selectedChar = null;
                    for (const char in data.samples) {
                        const sampleInfo = data.samples[char];
                        const res = await fetch(sampleInfo.data || sampleInfo);
                        const ab = await res.arrayBuffer();
                        const audioBuffer = await audioCtx.decodeAudioData(ab);
                        voiceLibrary[char] = {
                            buffer: audioBuffer,
                            offset: sampleInfo.offset !== undefined ? sampleInfo.offset : 0.20,
                            duration: sampleInfo.duration || 0.60
                        };
                    }
                    renderUI();
                    switchSentenceSlot(0);
                    saveToLocalStorage(true);
                    alert(`ライブラリを読み込みました！`);
                } catch (err) { alert("読み込みに失敗しました。"); }
            };
            reader.readAsText(file);
        }

        window.onload = async () => {
            renderUI();
            updateParamDisp();
            setupWaveformEvents();
            setupIntonationEvents();
            setupAllResetHandlers();
            
            await loadFromLocalStorage();
            
            // 初回表示時に強制的にノードをすべて0（まっすぐ）で生成して描画
            switchSentenceSlot(currentSentenceIdx);
            syncIntonationNodes(true);

            const wrapper = document.getElementById("intonation-canvas-wrapper");
            if (wrapper && window.ResizeObserver) {
                const ro = new ResizeObserver(() => {
                    requestAnimationFrame(() => {
                        drawIntonationGraph();
                        drawTrimWaveform();
                    });
                });
                ro.observe(wrapper.parentElement || wrapper);
            }

            setTimeout(() => {
                syncIntonationNodes(true);
                drawTrimWaveform();
            }, 100);
        };

        window.onresize = () => {
            drawTrimWaveform();
            drawIntonationGraph();
        };
    </script>
